---
- name: Skip Kafka UI installation when disabled
  ansible.builtin.meta: end_play
  when: not (kafka_ui_enabled | bool)

- name: Check Kafka broker service exists
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    name: kafka
    namespace: "{{ kafka_ui_namespace }}"
  register: kafka_broker_svc

- name: Fail when Kafka broker service is missing
  ansible.builtin.assert:
    that:
      - kafka_broker_svc.resources | length > 0
    fail_msg: >-
      Service kafka not found in namespace {{ kafka_ui_namespace }}.
      Run install-kafka.sh first.

- name: Apply Kafka UI Deployment
  kubernetes.core.k8s:
    state: present
    template: deployment.yaml.j2

- name: Apply Kafka UI Service
  kubernetes.core.k8s:
    state: present
    template: service.yaml.j2

- name: Expose Kafka UI through Traefik
  ansible.builtin.import_tasks: routing.yml

# Deployment pod-template changes (affinity) already trigger a rolling update.
- name: Wait for Kafka UI rollout
  ansible.builtin.command: >-
    kubectl -n {{ kafka_ui_namespace }} rollout status
    deployment/{{ kafka_ui_app_name }} --timeout=300s
  environment:
    KUBECONFIG: "{{ lookup('env', 'KUBECONFIG') }}"
  changed_when: false

- name: Show Kafka UI placement
  ansible.builtin.command: >
    kubectl get pods -n {{ kafka_ui_namespace }}
    -l app.kubernetes.io/name={{ kafka_ui_app_name }}
    -o wide --no-headers
  environment:
    KUBECONFIG: "{{ lookup('env', 'KUBECONFIG') }}"
  register: kafka_ui_pod_wide
  changed_when: false
  failed_when: false

- name: Print Kafka UI placement
  ansible.builtin.debug:
    msg: "Kafka UI placement: {{ kafka_ui_pod_wide.stdout | default('unknown') }}"
  changed_when: false

- name: Run Kafka UI validation tasks
  ansible.builtin.import_tasks: validate.yml
