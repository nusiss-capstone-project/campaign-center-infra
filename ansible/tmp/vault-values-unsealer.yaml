# HashiCorp Vault — standalone + unsealer sidecar (dev)
global:
  enabled: true

injector:
  enabled: false

server:
  enabled: true
  dev:
    enabled: false
  standalone:
    enabled: true
    config: |
      ui = true
      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }
      storage "file" {
        path = "/vault/data"
      }
  ha:
    enabled: false
  dataStorage:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
  service:
    enabled: true
    type: ClusterIP
  ingress:
    enabled: false
  httproute:
    enabled: false
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  extraContainers:
    - name: unsealer
      image: hashicorp/vault:2.0.2
      imagePullPolicy: IfNotPresent
      env:
        - name: VAULT_ADDR
          value: http://127.0.0.1:8200
        - name: VAULT_UNSEAL_KEY
          valueFrom:
            secretKeyRef:
              name: vault-unseal-key
              key: unseal.key
        - name: UNSEAL_POLL_INTERVAL
          value: "5"
      command:
        - /bin/sh
        - -ec
        - |
          set -eu
          export VAULT_ADDR="${VAULT_ADDR:-http://127.0.0.1:8200}"
          INTERVAL="${UNSEAL_POLL_INTERVAL:-5}"
          echo "vault-unsealer sidecar started (poll=${INTERVAL}s)"
          while true; do
            set +e
            vault status >/tmp/vs 2>&1
            rc=$?
            set -e
            if [ "${rc}" -eq 1 ]; then
              sleep "${INTERVAL}"
              continue
            fi
            if ! grep -q 'Initialized.*true' /tmp/vs; then
              sleep 10
              continue
            fi
            if [ "${rc}" -eq 0 ]; then
              sleep 10
              continue
            fi
            if grep -q 'Sealed.*true' /tmp/vs; then
              echo "Vault sealed — unsealing..."
              vault operator unseal "${VAULT_UNSEAL_KEY}" || true
            fi
            sleep "${INTERVAL}"
          done
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi

ui:
  enabled: true
  serviceType: ClusterIP
